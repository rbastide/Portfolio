    <!-- Intro (js/controllers/intro.js) : décidée avant le premier affichage pour
         que la page n'apparaisse pas un instant avant elle. Une fois par session,
         jamais avec le mouvement réduit ni en arrivant sur une ancre. -->
    <script>
        try {
            if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !location.hash && !sessionStorage.getItem('intro-seen')) {
                document.documentElement.classList.add('intro-pending');
            }
        } catch (e) { /* stockage indisponible : pas d'intro */ }
    </script>
    <script type="module" src="js/main.js?v=56"></script>
