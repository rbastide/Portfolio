# Proxy ReyMysterio → Groq. Déploiement : voir worker/README.md
name = "reymysterio"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
# Origines autorisées à appeler le proxy (séparées par des virgules).
ALLOWED_ORIGINS = "https://rbastide.github.io,https://remi-bastide.is-a.dev,http://localhost:3000,http://127.0.0.1:8765,http://82.70.233.203"
# Modèle Groq : vérifier qu'il est toujours proposé sur https://console.groq.com/docs/models
MODEL = "openai/gpt-oss-120b"

# 20 questions par minute et par adresse IP, au-delà le site répond en local.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }
